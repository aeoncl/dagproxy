[package]
name = "dagproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
netaddr2 = "0.10.0"
netwatcher = "0.6.0"
tokio = { version = "1.52.2", features = ["full"] }
anyhow = "1.0.102"
httparse = "1.10.1"
bytes = "1.11.1"
backon = "1.6.0"
base64 = "0.22.1"
cross-krb5 = "0.4.2"
indexmap = { version = "2", features = ["serde"] }
#curl = { version = "0.4.49", features = ["ssl", "spnego"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
no-proxy = "0.3.6"

#PAC
boa_engine = "0.21.1"
reqwest = { version = "0.13.3", features = ["blocking", "default-tls"] }
chrono = { version = "0.4.44", features = ["clock"] }
regex = "1.12.3"
