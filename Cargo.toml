[package]
name = "dagproxy"
version = "1.6.0"
edition = "2024"
description = "A local HTTP proxy that dispatches traffic through different configuration. Supports upstream proxy with kerberos auth with SPNego."

[dependencies]
netaddr2 = "0.10.0"
netwatcher = "0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
httparse = "1.10.1"
bytes = "1.12.1"
backon = "1.6.0"
base64 = "0.23.1"
cross-krb5 = "0.5.0"
indexmap = { version = "2.14.0", features = ["serde"] }
#curl = { version = "0.4.49", features = ["ssl", "spnego"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
no-proxy = "0.3.7"
rand = "0.10.2"

[package.metadata.deb]
section = "net"
maintainer = "Christophe Lopez <c.lopez.dev@protonmail.com>"
copyright = "2026, Christophe Lopez"
license-file = ["LICENSE"]
maintainer-scripts = "debian"
conf-files = ["/etc/dagproxy/config.json"]
extended-description = "A local HTTP proxy that dispatches traffic through different configuration. Supports upstream proxy with kerberos auth with SPNego."
assets = [
    ["target/release/dagproxy", "/usr/bin/", "755"],
    ["packaging/dagproxy.service", "/usr/lib/systemd/user/", "644"],
    ["sample-config.json", "/etc/dagproxy/config.json", "644"]
]
