[package]
name = "dagproxy"
version = "1.5.0-SNAPSHOT"
edition = "2024"

[dependencies]
netaddr2 = "0.10.0"
netwatcher = "0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
httparse = "1.10.1"
bytes = "1.12.1"
backon = "1.6.0"
base64 = "0.23.1"
cross-krb5 = "0.5.0"
indexmap = { version = "2.14.0", features = ["serde"] }
#curl = { version = "0.4.49", features = ["ssl", "spnego"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
no-proxy = "0.3.7"
rand = "0.10.2"

[package.metadata.deb]
maintainer = "Christophe Lopez <c.lopez.dev@protonmail.com>"
copyright = "2026, Christophe Lopez"
license-file = ["LICENSE"]
assets = [
    ["target/release/dagproxy", "/usr/bin/", "755"]
]